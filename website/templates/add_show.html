<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Show</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script>
        function toggleAddShowForm() {
            const form = document.getElementById("add-show-form");
            if (form.style.display === "none") {
                form.style.display = "block";
            } else {
                form.style.display = "none";
            }
        }
    </script>
</head>
<body>
    <div class="container mt-5">
        <h2>Add Show</h2>
        <button id="add-show-btn" class="btn btn-primary mt-3" onclick="toggleAddShowForm()">Add Show</button>

        <!-- Add Show Form (initially hidden) -->
        <div id="add-show-form" style="display: none;">
            <form method="POST" action="{{ url_for('views.add_show') }}">
                <div class="form-group">
                    <label for="title">Title:</label>
                    <input type="text" name="title" id="title" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="genre">Genre:</label>
                    <select name="genre" id="genre" class="form-control" title="Select the genre of the show">
                        <option value="Action">Action</option>
                        <option value="Comedy">Comedy</option>
                        <option value="Drama">Drama</option>
                        <option value="Fantasy">Fantasy</option>
                        <option value="Horror">Horror</option>
                        <option value="Romance">Romance</option>
                        <option value="Sci-Fi">Sci-Fi</option>
                        <!-- Add more genres as needed -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="release_year">Release Year:</label>
                    <input type="number" name="release_year" id="release_year" class="form-control" min="1900" max="{{ current_year }}" placeholder="Enter or select year" required>
                </div>
                <div class="form-group">
                    <label for="rating">Rate the Show (1 to 10):</label>
                    <input type="range" name="rating" id="rating" class="form-range" min="1" max="10" step="1" value="5" oninput="this.nextElementSibling.value = this.value">
                    <output>5</output>
                </div>
                <div class="form-group">
                    <label for="description">Description (optional):</label>
                    <textarea name="description" id="description" class="form-control" rows="3" placeholder="Write a short description..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Add Show</button>
                <a href="{{ url_for('views.home') }}" class="btn btn-secondary ml-2">Cancel</a>
            </form>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show mt-3" role="alert">
                    {{ message }}
                    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
            {% endfor %}
        {% endif %}
        {% endwith %}
    </div>

    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
</body>
</html>
